services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antigravity-backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ./backend/.env
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: antigravity-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env.local
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
