<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2>Verify Your Email</h2>
    <p>Welcome to PropFirm! Please verify your email address by clicking the link below:</p>
    <p style="text-align: center; margin: 30px 0;">
      <a href="{{verifyUrl}}" style="background: #4f46e5; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block;">Verify Email</a>
    </p>
    <p>Or copy and paste this URL into your browser:</p>
    <p style="word-break: break-all; color: #4f46e5;">{{verifyUrl}}</p>
    <p>This link expires in 24 hours.</p>
    <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
    <p style="color: #888; font-size: 12px;">If you did not create this account, please ignore this email.</p>
  </div>
</body>
</html>
